<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ダーク検索ラッパー</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" id="container" role="main">
    <header class="header">
      <div class="logo">GN</div>
      <h1 class="title">GeForce Now ラッパー</h1>
    </header>

    <section class="card" aria-labelledby="desc">
      <p id="desc" class="desc">閲覧したいURLを入力してください。外部サイトは埋め込まず、当サイトの表示ページ経由で開きます。</p>

      <form id="searchForm" class="search-row" novalidate>
        <input id="urlInput" class="input" type="url" placeholder="https://example.com または example.com" required />
        <button class="search-btn" type="submit" aria-label="検索">検索</button>
      </form>

      <div class="hint">例：wikipedia.org/wiki/Apple や https://example.com/path</div>

      <div class="status-bar" aria-hidden="true"><span class="pulse"></span></div>

      <footer class="foot">外部サイトは新しいタブで開かれます。 직접埋め込みや取得は行いません。</footer>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
