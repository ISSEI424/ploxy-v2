<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロキシサイト</title>
    <style>
        body {
            background-color: #2c2c2c;
            color: white;
            font-family: Arial, sans-serif;
        }
        #searchContainer {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        #urlInput {
            border: none;
            border-radius: 25px;
            padding: 10px;
            width: 600px; /* 検索バーの幅 */
            margin-right: 10px; 
        }
        #searchButton {
            border-radius: 25px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px; /* ボタンの上下左右の余白 */
            cursor: pointer;
        }
        #searchButton:hover {
            background-color: #0056b3; /* ホバー時の色 */
        }
        #loginForm {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        #username, #password {
            margin-right: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        #loginButton {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center;">プロキシサイト</h1>
    <div id="loginForm">
        <input id="username" type="text" placeholder="ユーザー名" required>
        <input id="password" type="password" placeholder="パスワード" required>
        <button id="loginButton">ログイン</button>
    </div>
    <div id="searchContainer">
        <input type="text" id="urlInput" placeholder="URLを入力" required>
        <button id="searchButton">🔍</button>
    </div>
    <div id="result"></div>
    
    <script>
        document.getElementById('loginButton').addEventListener('click', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });
            
            const text = await response.text();
            if (response.ok) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('searchContainer').style.display = 'flex';
            } else {
                alert(text);
            }
        });

        document.getElementById('searchButton').addEventListener('click', async (e) => {
            const url = document.getElementById('urlInput').value;
            const response = await fetch(`/proxy?url=${encodeURIComponent(url)}`);
            const result = await response.text();
            document.getElementById('result').innerHTML = result;
        });
    </script>
</body>
</html>
